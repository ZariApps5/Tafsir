pluginManagement {
    // Allow dl.google.com to go through the proxy (remove it from nonProxyHosts)
    System.setProperty("http.nonProxyHosts", "localhost")
    System.setProperty("https.nonProxyHosts", "localhost")
    repositories {
        mavenLocal()
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenLocal()
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

rootProject.name = "TafsirIbnKathir"
include ':app'
